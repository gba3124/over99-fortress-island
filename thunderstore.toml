[config]
schemaVersion = "0.0.1"

[package]
namespace = "gba3124"
name = "OVER_99_Fortress_Island"
versionNumber = "0.2.9"
description = "Beat the final boss and the sea strikes back with a fortress island and 100 waves of fish in sneakers. Hold the lighthouse with your friends and go OVER 99."
websiteUrl = "https://github.com/gba3124/over99-fortress-island"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "./thunderstore/icon.png"
readme = "./thunderstore/README.md"
outdir = "./build"

[[build.copy]]
source = "./HtfFortress/bin/Release/netstandard2.1/HtfFortress.dll"
target = ""
[[build.copy]]
source = "./HtfFortress/Models"
target = "Models"
[[build.copy]]
source = "./HtfFortress/Icons"
target = "Icons"

[publish]
repository = "https://thunderstore.io"
communities = [ "how-to-fish" ]
